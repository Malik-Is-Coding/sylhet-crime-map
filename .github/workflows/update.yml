# Save this file in your repository as .github/workflows/update.yml
name: update-reports
on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes (GitHub may delay runs a little)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install feedparser anthropic
      - run: python collector.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - run: |
          git config user.name "report-bot"
          git config user.email "report-bot@users.noreply.github.com"
          git add reports.json
          git diff --cached --quiet || (git commit -m "update reports" && git push)
